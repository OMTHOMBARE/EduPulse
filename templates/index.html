<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPulse | Student Performance Predictor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #1f4037, #99f2c8);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .main-layout {
        display: flex;
        gap: 30px;
        flex-wrap: wrap;
        justify-content: center;
        padding: 20px;
    }

    .card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        padding: 25px;
        width: 380px;
        transition: transform 0.3s ease;
    }

    .card:hover {
        transform: translateY(-5px);
    }

    h2 {
        text-align: center;
        margin-bottom: 15px;
        color: #1f4037;
    }

    h3 {
        text-align: center;
        margin-bottom: 10px;
        color: #333;
    }

    label {
        font-size: 14px;
        margin-top: 10px;
        display: block;
        color: #333;
        font-weight: 600;
    }

    input, select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 8px;
        border: 1px solid #ccc;
        outline: none;
        transition: 0.3s;
    }

    input:focus, select:focus {
        border-color: #2cb489;
        box-shadow: 0 0 5px rgba(44,180,137,0.5);
    }

    button {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        background: linear-gradient(135deg, #2cb489, #1f8a6a);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        opacity: 0.9;
        transform: scale(1.02);
    }

    .result {
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        text-align: center;
        font-weight: bold;
        background: #e8f8f5;
        border-left: 6px solid #2ecc71;
        animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .footer {
        margin-top: 15px;
        text-align: center;
        font-size: 12px;
        color: #777;
    }

    canvas {
        margin-top: 10px;
    }

</style>
</head>
<body>

<div class="main-layout">

    <!-- FORM CARD -->
    <div class="card">
        <h2>📊 EduPulse</h2>

        <form action="/predict" method="post">

            <label>G1 – First Period Grade</label>
            <input type="number" name="G1" min="0" max="20" required>

            <label>G2 – Second Period Grade</label>
            <input type="number" name="G2" min="0" max="20" required>

            <label>Study Time (1–4)</label>
            <input type="number" name="studytime" min="1" max="4" required>

            <label>Failures</label>
            <input type="number" name="failures" min="0" max="4" required>

            <label>Health (1–5)</label>
            <input type="number" name="health" min="1" max="5" required>

            <label>Free Time (1–5)</label>
            <input type="number" name="freetime" min="1" max="5" required>

            <label>Daily Alcohol Consumption</label>
            <input type="number" name="Dalc" min="1" max="5" required>

            <label>Weekend Alcohol Consumption</label>
            <input type="number" name="Walc" min="1" max="5" required>

            <label>Family Support</label>
            <select name="famsup">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>

            <label>School Support</label>
            <select name="schoolsup">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>

            <label>Paid Classes</label>
            <select name="paid">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>

            <label>Internet Access</label>
            <select name="internet">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>

            <label>Extra Activities</label>
            <select name="activities">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>

            <button type="submit">🚀 Predict Final Grade</button>
        </form>

        {% if prediction is not none %}
        <div class="result">
            Predicted G3: {{ prediction }} <br>
            Status: <strong>{{ category }}</strong>
        </div>
        {% endif %}

        <div class="footer">
            EduPulse • ML + Flask Project
        </div>
    </div>

    <!-- CHART CARD -->
    {% if prediction is not none %}
    <div class="card">
        <h3>📈 Performance Comparison</h3>
        <canvas id="gradeChart"></canvas>
    </div>
    {% endif %}

</div>

{% if prediction is not none %}
<script>
    const ctx = document.getElementById('gradeChart');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['G2', 'Predicted G3'],
            datasets: [{
                label: 'Grades',
                data: [{{ g2 }}, {{ prediction }}]
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    max: 20
                }
            }
        }
    });
</script>
{% endif %}

</body>
</html>
